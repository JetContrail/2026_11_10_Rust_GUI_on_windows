[package]
name = "paint-ui"
description = "Windows GUI paint application (eframe/egui view and composition root)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "paint"
path = "src/main.rs"

[dependencies]
paint-app.workspace = true
paint-persistence.workspace = true
eframe = "0.37"
rfd = "0.17"
paint-domain.workspace = true
paint-tools.workspace = true
paint-engine.workspace = true

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
paint-persistence.workspace = true
tempfile = "3"
