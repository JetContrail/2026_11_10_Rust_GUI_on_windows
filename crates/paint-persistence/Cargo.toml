[package]
name = "paint-persistence"
description = "Persistence adapters: image import (PNG/JPEG/BMP), .paint project files and PNG export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
paint-domain.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontique = { version = "0.11.1", features = ["system", "fontconfig-dlopen"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
