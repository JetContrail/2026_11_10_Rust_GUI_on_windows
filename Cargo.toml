[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/JetContrail/2026_11_10_Rust_GUI_on_windows"

[workspace.dependencies]
paint-domain = { path = "crates/paint-domain" }
paint-engine = { path = "crates/paint-engine" }
paint-tools = { path = "crates/paint-tools" }
paint-persistence = { path = "crates/paint-persistence" }
paint-app = { path = "crates/paint-app" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
